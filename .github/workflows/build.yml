name: Build and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macOS-Universal
          - os: windows-2022
            target: Windows-x64
          - os: ubuntu-24.04
            target: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Universal Python from Python.org
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.python.org/ftp/python/3.13.15/python-3.13.15-macos11.pkg -o "$RUNNER_TEMP/python.pkg"
          echo "3b7eaf7f29825f796e8267024435540ddf1f17fc9a97ad58095daa7a75bfdcd3  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c -
          pkgutil --check-signature "$RUNNER_TEMP/python.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          echo /Library/Frameworks/Python.framework/Versions/3.13/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Test and build macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_TARGET_ARCH: universal2
        run: |
          python3 -m pip install -r requirements-build.txt
          python3 -m unittest discover -s tests -v
          python3 tracker_radar.py --smoke-test
          python3 scripts/gui_qa.py
          python3 build.py
          'dist/Tracker Radar.app/Contents/MacOS/Tracker Radar' --smoke-test
          arch -x86_64 'dist/Tracker Radar.app/Contents/MacOS/Tracker Radar' --smoke-test
          python3 package.py macOS-Universal
      - name: Test and build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python tracker_radar.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source smoke failed' }
          python scripts/gui_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI checks failed' }
          python build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $process = Start-Process -FilePath 'dist/Tracker Radar/Tracker Radar.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke failed' }
          python package.py Windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Test and build Linux on Debian 12
        if: runner.os == 'Linux'
        run: docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src python:3.13.15-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e sh scripts/build-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release version and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py release-assets
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Tracker Radar $RELEASE_TAG" --notes-file RELEASE_NOTES.md
